# vLLM 磁盘 KV 缓存清理配置 — 改完保存即可, 清理服务每轮(INTERVAL_SEC)重读, 无需重启
# 上限(GiB): 总量超过就触发清理
# 2026-11-25: 250 -> 190, 给盘的高速暂存区(SLC)留空余, 观察单流盘速是否回升
LIMIT_GB=190
# 低水位(GiB): 触发后一口气删到 LIMIT_GB - LOW_WATER_GB (190-10=180), 避免天天顶格小批量删
LOW_WATER_GB=10
# 检查间隔(秒)
INTERVAL_SEC=60
# 宽限期(分钟): 最近 N 分钟内被写或被读过的块不删, 避开正在活跃使用的前缀
GRACE_MIN=10
# 淘汰顺序: lru = 按 max(mtime, atime) 从最久没用的删; mtime = 只看创建时间(v1 行为)
# lru 需要数据盘 atime 真实更新: 挂载选项用 strictatime, 或读盘路径里 os.utime
SORT_KEY=lru
# 缓存目录(只删其中 checkpoint-*/ 下的 .bin/.tmp 块文件)
CACHE_DIR=/home/l/vllm-kv-cache
# 可选: 批量删除后限频执行 TRIM (需要免密权限; 更推荐直接 systemctl enable --now fstrim.timer)
# FSTRIM_CMD=sudo -n /usr/sbin/fstrim -v /home
# FSTRIM_MIN_FREED_GB=5
# FSTRIM_MIN_INTERVAL_MIN=60
