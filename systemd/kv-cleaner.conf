# vLLM 磁盘 KV 缓存清理配置 — 改完保存即可, 清理服务每轮(默认5分钟)重读, 无需重启
# 上限(GiB): 超过就从最老的块文件开始删, 删到低于上限为止
# 2026-11-25: 250 -> 190, 给盘的高速暂存区(SLC)留空余, 观察单流盘速是否回升
LIMIT_GB=190
# 检查间隔(秒)
INTERVAL_SEC=60
# 宽限期(分钟): 最近 N 分钟内写过的块不删, 避开正在活跃使用的前缀
GRACE_MIN=10
# 缓存目录(只删其中 checkpoint-*/ 下的 .bin/.tmp 块文件)
CACHE_DIR=/home/l/vllm-kv-cache
